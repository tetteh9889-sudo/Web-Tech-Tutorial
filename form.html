<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
</head>
<body>
    <h2>User Registration Form</h2>

    <form action="#" method="POST">
    <p><label for="name">Name :</label> <br></p>
    <input type="text" id="name" name="name" required>

    <p><label for="email">Email</label></p>
    <input type="email" id=email" name="email" required>

    <p><labe for="password">Password</labe></p>
    <input type="password" id="password" name="password" required>
    
    <p><label for="gender">Gender</label></p>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female" required>
    <label for="female">Female</label>
    
    <p><label>Interests</label></p>
    <input type="checkbox" id="sports" name="interests" value="sports">
    <label for="interests">Sports</label>

    <input type="checkbox" id="music" name="interests" value="music">
    <label for="interests">Music</label>

    <input type="checkbox" id="reading" name="interests" value="reading">
    <label for="interests">Reading</label>

    <p><input type="submit" value="submit"></p>


</body>
</html>
